name: Run Manually NUnit and Selenium Tests

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Nombre de la rama a probar'
        required: true
        default: 'Master'
        type: string

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore NuGet Packages
        run: dotnet restore AutomatedScript.sln

      - name: Build Solution
        run: dotnet build AutomatedScript.sln --configuration Release --no-restore

      - name: Run NUnit and Selenium Tests
        continue-on-error: true
        env:
          CI: true
        run: >
          dotnet test AutomatedScript.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=TestResults.trx;OutputDirectory=TestResults"

      - name: List screenshot files
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "${{ github.workspace }}\TestResults\Screenshots") {
            Get-ChildItem "${{ github.workspace }}\TestResults\Screenshots"
          } else {
            Write-Host "No screenshots found"
          }

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nunit-selenium-results
          path: ${{ github.workspace }}/TestResults/TestResults.trx

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-screenshots
          path: ${{ github.workspace }}/TestResults/Screenshots

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: NUnit and Selenium Tests
          path: TestResults/TestResults.trx
          reporter: dotnet-trx
